<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投诉选项</title>
    <style>
        * {
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            height: 100vh;
        }

        .container {
            max-width: 750px;
            padding-block: 60px;
            height: 100vh;
            margin: 0 auto;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-direction: column;
            box-sizing: border-box;
        }

        .textbox {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        h2 {
            font-size: 16px;
            margin-bottom: 20px;
            margin-top: 20px;
            color: #333;
            padding-inline: 16px;
            font-weight: 500;
        }

        .icon {
            display: inline-block;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #0cc262;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon::after {
            content: '';
            display: inline-block;
            width: 10px;
            height: 20px;
            border-bottom: 4px solid #fff;
            border-right: 4px solid #fff;
            transform: translateY(-4px) rotate(45deg);

        }

        p {
            font-size: 16px;
            color: #333;
            opacity: 1;
            cursor: pointer;
            text-align: center;
        }



        .mt-10 {
            margin-top: 10px;
        }

        .fs-14 {
            font-size: 14px;
        }

        .ccc {
            color: #ccc;
        }


        button {
            width: 200px; 
            height: 40px;
            line-height: 40px;
            font-size: 15px;
            background-color: #0cc262;
            border-radius: 4px;
            border: none;
            color: #fff;

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="textbox">
            <span class="icon"></span>
           <h2 style="font-weight: bold;">投诉已提交</h2>
            <p>微信团队会尽快核实，并通过"微信团队“通知你审核结果。感谢你的支持。</p>
        </div>
        <div style="display: flex;align-items: center;justify-content: center;">
           
            <a href="complaint.html">
                <button type="button" id="submit">关闭</button>
            </a>
        </div>
    </div>

</body>

</html>
