<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投诉选项</title>
    <style>
        * {
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            height: 100vh;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            overflow: hidden;
        }

        h2 {
            font-size: 14px;
            margin-bottom: 5px;
            margin-top: 20px;
            color: #999;
            padding-inline: 16px;
            font-weight: 500;
            opacity: 0.9;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            font-size: 16px;
            padding: 14px 16px;
            background-color: #fff;
            cursor: pointer;
            position: relative;
        }

        li>a,li .imgnumber {
            color: #333;
            text-decoration: none;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;

        }
        
        li::before {
            content: '';
            width: calc(100% - 16px);
            height: 1px;
            background-color: #f5f5f5;
            position: absolute;
            bottom: 0;
            left: 16px;
        }

       li .txt{
        font-size: 12px;
        color: #ccc;
       }

        p {
            font-size: 14px;
            color: #007bff;
            cursor: pointer;
            margin-top: 20px;
            text-align: center;
        }

        .zhengju {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            color: #ccc;

        }
        .zhengju::after {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            margin-left: 5px;
            border-top: 1px solid #ccc;
            border-right: 1px solid #ccc;
            box-sizing: border-box;
            transform: rotate(45deg);

        }
        .update_btn{
            width: 80px;
            height: 80px;
            background-color: rgba(204, 204, 204, .4);
            position: relative;
            margin-top: 10px;
        }
        .update_btn::after{
            content: '';
            width: 30px;
            height: 2px;
            background-color: #999;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);

        }
        .update_btn::before{
            content: '';
            height: 30px;
            width: 2px;
            background-color: #999;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);

        }
        .update_btn input{
            width: 100%;
            height: 100%;
            opacity: 0;
        }
        .mt-10{
            margin-top: 10px;
        }
        .fs-14{font-size: 14px;}
        .ccc{color: #ccc;}
        textarea{
            font-size: 16px;
            width: 100%;
            height: 120px;
            border: none;
            resize: none;
        }
        textarea:focus{
            outline: none;
        }
        textarea::placeholder{
            font-size: 16px;
            color: #ccc;
        }
        .imgbox img{
            vertical-align: bottom;
            width: 80px;
            height: 80px;
            margin-right: 10px;
            margin-top: 10px;
        }
        button{
            width: 170px;
            height: 36px;
            line-height: 32px;
            font-size: 14px;
            background-color: #0cc262;
            border-radius: 4px;
            margin: 40px 0;
            border: none;
            color: #fff;

        }
    </style>
</head>

<body>
    <div class="container">
        <ul>
            <!-- <li>
                <a href="#" class="a">
                    <span>聊天证据(必选)</span>
                    <span class="zhengju">0条聊天证据</span>
                </a>
                <div class="txt">需收集此信息以判断投诉结果</div>
            </li> -->
            <li>
                <div class="imgnumber">
                    <span>图片证据(选填)</span>
                    <span class="ccc" id="imglength">0张/9</span>
                </div>
                <div style="display: flex;flex-wrap: wrap; align-items: center;">
                    <div class="imgbox"></div>
                    <div class="update_btn">
                        <input type="file" id="image-upload" accept="image/*" />
                    </div>
                </div>
            </li>
            <li>
                <a href="#" class="a">
                    <span style="color: #ccc;"></span>
                </a>
                <div style="position: relative;">
                    <textarea  placeholder="投诉内容(选填)" maxlength="200" class="textarea"></textarea>
                    <span style="color: #ccc;font-size: 12px;position: absolute;right: 0;bottom: 0;" id="textlength">0/200</span>
                </div>
            </li>
        </ul>
        <div style="display: flex;align-items: center;justify-content: center;">
            <a href="./success.html" style="color: #fff;text-decoration: none;">
                <button type="button" id="submit">
                    提交
                </button>
            </a>
            
        </div>
    </div>

</body>

</html>
<script>
    document.getElementById('image-upload').addEventListener('change', function(e) {
        var file = e.target.files[0];
        var reader = new FileReader();
        reader.onload = function(e) {
            let img = document.createElement('img')
            img.height = 80
            img.width = 80
            img.src = e.target.result
            document.querySelector('.imgbox').appendChild(img)
            let length = document.querySelector('.imgbox').children.length
            document.querySelector('#imglength').innerHTML = `${length}张/9`
        };
        
        reader.readAsDataURL(file);
        
    });
  
    document.querySelector('.textarea').addEventListener('input',function(e) {
        document.querySelector('#textlength').innerHTML = `${String(e.target.value).length}/200`
    })
    
</script>
